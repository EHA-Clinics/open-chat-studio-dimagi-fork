# generic3 CronJob — Django migrate --noinput.
# First run: kubectl -n ocs-dev create job ocs-migrate-manual --from=cronjob/<release-name>
# See docs/hosting/clinics-gke.md

resourceType: cronjob

cronjob:
  # Infrequent schedule; prefer manual Job from CronJob for cutover.
  schedule: "0 3 1 * *"
  backoffLimit: 1
  restartpolicy: Never
  concurrencyPolicy: Forbid

nameOverride: migrate
fullnameOverride: ocs-migrate

image:
  repository: eu.gcr.io/clinics-dev-359913/open-chat-studio-migrate
  pullPolicy: Always

app:
  name: migrate
  port: 8000
  secret: open-chat-studio
  scaling:
    enabled: false
  args:
    - python
    - manage.py
    - migrate
    - --noinput
  probe:
    type: tcp
    initialDelaySeconds: 5
    periodSeconds: 30
  resources:
    requests:
      cpu: 100m
      memory: 512M
    limits:
      cpu: 1000m
      memory: 1536M
  db:
    create: false
    enabled: true
    host: 127.0.0.1
    user: open_chat_studio
    name: open_chat_studio
    secret: database-credentials

database:
  instance: clinics-dev-359913:europe-west1:eha-clinics-dev

extra_env_vars:
  DJANGO_SETTINGS_MODULE: config.settings_production

env_secrets:
  enabled: true
  name: open-chat-studio

vaultextrasecrets:
  enabled: true
  rolloutrestart: false
  secrets:
    - name: open-chat-studio
      path: ehaclinics/dev/open-chat-studio
    - name: database-credentials
      path: ehaclinics/dev/open-chat-studio/database-credentials
    - name: cloudsql-instance-credentials
      path: ehaclinics/dev/open-chat-studio/cloudsql-instance-credentials

nginx:
  enabled: false

ingress:
  enabled: false
