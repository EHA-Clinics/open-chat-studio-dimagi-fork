# generic3 — Open Chat Studio web (gunicorn).
# Secrets from Vault via vaultextrasecrets — do not commit secret values.
# See docs/hosting/clinics-gke.md

replicaCount: 1

nameOverride: web
fullnameOverride: ocs-web

image:
  repository: eu.gcr.io/clinics-dev-359913/open-chat-studio-web
  pullPolicy: Always

podAntiAffinity:
  enabled: false

app:
  name: web
  port: 8000
  secret: open-chat-studio
  minAvailable: 0
  scaling:
    enabled: false
  probe:
    type: request
    path: /status/
    initialDelaySeconds: 40
    periodSeconds: 15
  resources:
    requests:
      cpu: 250m
      memory: 512M
    limits:
      cpu: 1000m
      memory: 2048M
  db:
    create: false
    enabled: true
    host: 127.0.0.1
    user: open_chat_studio
    name: open_chat_studio
    secret: database-credentials

database:
  instance: clinics-dev-359913:europe-west1:eha-clinics-dev

extra_env_vars:
  DJANGO_SETTINGS_MODULE: config.settings_production
  PORT: "8000"
  DJANGO_SECURE_SSL_REDIRECT: "False"
  RATE_LIMIT_TRUSTED_PROXY_COUNT: "1"

env_secrets:
  enabled: true
  name: open-chat-studio

vaultextrasecrets:
  enabled: true
  rolloutrestart: true
  secrets:
    - name: open-chat-studio
      path: ehaclinics/dev/open-chat-studio
    - name: database-credentials
      path: ehaclinics/dev/open-chat-studio/database-credentials
    - name: cloudsql-instance-credentials
      path: ehaclinics/dev/open-chat-studio/cloudsql-instance-credentials

nginx:
  enabled: true
  healthCheckPath: /status/
  config: |
    server {
      {{- if .Values.debug }}
      error_log /var/log/nginx/error.log info;
      {{- else }}
      access_log off;
      {{- end }}
      location /health {
        proxy_pass http://127.0.0.1:{{ .Values.app.port }}{{ .Values.nginx.healthCheckPath }};
      }
      location /status/ {
        proxy_pass http://127.0.0.1:{{ .Values.app.port }}/status/;
      }
    }
    server {
      server_name {{ .Values.url }};
      {{- if .Values.debug }}
      error_log   /var/log/nginx/error.log info;
      {{- else }}
      access_log  off;
      {{- end }}
      client_max_body_size 20M;
      if ($http_x_forwarded_proto != 'https') {
        return 301 https://$host$request_uri;
      }
      location / {
        proxy_pass http://127.0.0.1:{{ .Values.app.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host:443;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
      }
    }

service:
  type: NodePort
  externalPort: 80
  internalPort: 80

url: ocs-dev.eha.ng

ingress:
  enabled: true
  className: traefik
  hosts:
    - ocs-dev.eha.ng
  ssl:
    letsencrypt: true
    cert_secret: ocs-dev.eha.ng
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: letsencrypt
    cert-manager.io/acme-challenge-type: dns01
    cert-manager.io/acme-dns01-provider: route53
