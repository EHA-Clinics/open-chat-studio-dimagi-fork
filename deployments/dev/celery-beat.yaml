# generic3 — Celery beat (singleton).
# See docs/hosting/clinics-gke.md

replicaCount: 1

nameOverride: celery-beat
fullnameOverride: ocs-celery-beat

image:
  repository: eu.gcr.io/clinics-dev-359913/open-chat-studio-celery-beat
  pullPolicy: Always

podAntiAffinity:
  enabled: false

app:
  name: celery-beat
  port: 8000
  secret: open-chat-studio
  minAvailable: 0
  scaling:
    enabled: false
  args:
    - celery
    - -A
    - config
    - beat
    - -l
    - INFO
  probe:
    type: exec
    path: /tmp
    initialDelaySeconds: 30
    periodSeconds: 60
    timeout: "10"
    livenessProbeScriptName: beat-live.sh
    readinessProbeScriptName: beat-ready.sh
    livenessProbeScript: |
      #!/bin/bash
      exit 0
    readinessProbeScript: |
      #!/bin/bash
      exit 0
  resources:
    requests:
      cpu: 50m
      memory: 256M
    limits:
      cpu: 250m
      memory: 512M
  db:
    create: false
    enabled: true
    host: 127.0.0.1
    user: open_chat_studio
    name: open_chat_studio
    secret: database-credentials

database:
  instance: clinics-dev-359913:europe-west1:eha-clinics-dev

extra_env_vars:
  DJANGO_SETTINGS_MODULE: config.settings_production

env_secrets:
  enabled: true
  name: open-chat-studio

vaultextrasecrets:
  enabled: true
  rolloutrestart: true
  secrets:
    - name: open-chat-studio
      path: ehaclinics/dev/open-chat-studio
    - name: database-credentials
      path: ehaclinics/dev/open-chat-studio/database-credentials
    - name: cloudsql-instance-credentials
      path: ehaclinics/dev/open-chat-studio/cloudsql-instance-credentials

nginx:
  enabled: false

ingress:
  enabled: false

service:
  type: ClusterIP
  externalPort: 80
  internalPort: 8000
